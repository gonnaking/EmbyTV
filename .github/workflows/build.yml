name: Build EmbyTV APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Download Gradle binary without changing directories
      - name: Download Gradle
        id: download-gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O /tmp/gradle.zip
          cd /tmp && unzip -q gradle.zip

      # Generate wrapper from project root (not /tmp!)
      - name: Generate Gradle wrapper
        working-directory: ${{ github.workspace }}
        run: /tmp/gradle-8.5/bin/gradle wrapper --gradle-version 8.5

      - name: Build debug APK
        working-directory: ${{ github.workspace }}
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: embytv-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
